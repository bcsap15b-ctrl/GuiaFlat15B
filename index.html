<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flat 15B</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #f0f4f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-[100dvh] h-[100dvh] p-0 sm:p-4 overflow-hidden">

  <!-- Contentor da App Mobile -->
  <div class="w-full max-w-md bg-white h-[100dvh] max-h-[100dvh] sm:h-[844px] sm:max-h-[844px] sm:rounded-3xl overflow-hidden flex flex-col justify-between shadow-2xl relative border border-gray-100 min-h-0">

    <!-- HEADER PRINCIPAL (Visível no Menu) -->
    <div id="main-header" class="relative text-center text-white bg-[#002b49] pt-6 pb-4 px-4 rounded-b-3xl shrink-0">
      <div class="border-2 border-white/80 rounded-2xl p-2.5 inline-block mb-1.5 bg-white/10 backdrop-blur-sm">
        <h1 class="text-2xl font-extrabold tracking-widest leading-none">FLAT <span id="apto-code" class="bg-white text-[#002b49] px-2 py-0.5 rounded-md">15B</span></h1>
        <p id="condominio-name" class="text-[8px] tracking-widest mt-1 uppercase font-semibold"></p>
        <p class="text-[6px] tracking-wider opacity-80 uppercase"><span data-config="LUGAR1"></span> • <span data-config="LUGAR2"></span></p>
      </div>
      <h2 class="text-sm font-serif italic text-cyan-200 mt-0.5">Sejam bem-vindos!</h2>
      <p class="text-[8.5px] sm:text-[9px] text-blue-100 font-light px-1 mt-0.5 whitespace-nowrap overflow-hidden text-ellipsis">Guia rápido da estadia.</p>
    </div>

    <!-- TELA PRINCIPAL (Grelha do Menu) -->
    <main id="home-view" class="p-4 flex-1 min-h-0 overflow-y-auto hide-scrollbar">
      <div class="grid grid-cols-3 gap-2.5">

        <button onclick="openScreen('bem-vindo')" class="bg-[#e6f4f8] hover:bg-cyan-100 text-[#002b49] p-2.5 rounded-2xl flex flex-col items-center justify-center transition shadow-sm border border-cyan-100/50">
          <i class="fa-solid fa-house text-lg text-[#0088cc] mb-1"></i>
          <span class="text-[11px] font-semibold">Bem-vindos</span>
        </button>

        <button onclick="openScreen('checkin')" class="bg-[#e6f4f8] hover:bg-cyan-100 text-[#002b49] p-2.5 rounded-2xl flex flex-col items-center justify-center transition shadow-sm border border-cyan-100/50">
          <i class="fa-solid fa-key text-lg text-[#0088cc] mb-1"></i>
          <span class="text-[11px] font-semibold">Check-in</span>
        </button>

        <button onclick="openScreen('localizacao')" class="bg-[#e6f4f8] hover:bg-cyan-100 text-[#002b49] p-2.5 rounded-2xl flex flex-col items-center justify-center transition shadow-sm border border-cyan-100/50">
          <i class="fa-solid fa-location-dot text-lg text-[#0088cc] mb-1"></i>
          <span class="text-[11px] font-semibold">Localização</span>
        </button>

        <button onclick="openScreen('wifi')" class="bg-[#e6f4f8] hover:bg-cyan-100 text-[#002b49] p-2.5 rounded-2xl flex flex-col items-center justify-center transition shadow-sm border border-cyan-100/50">
          <i class="fa-solid fa-wifi text-lg text-[#0088cc] mb-1"></i>
          <span class="text-[11px] font-semibold">Wi-Fi</span>
        </button>

        <button onclick="openScreen('regras')" class="bg-[#e6f4f8] hover:bg-cyan-100 text-[#002b49] p-2.5 rounded-2xl flex flex-col items-center justify-center transition shadow-sm border border-cyan-100/50">
          <i class="fa-solid fa-clipboard-list text-lg text-[#0088cc] mb-1"></i>
          <span class="text-[11px] font-semibold">Regras</span>
        </button>

        <button onclick="openScreen('estrutura')" class="bg-[#e6f4f8] hover:bg-cyan-100 text-[#002b49] p-2.5 rounded-2xl flex flex-col items-center justify-center transition shadow-sm border border-cyan-100/50">
          <i class="fa-solid fa-building text-lg text-[#0088cc] mb-1"></i>
          <span class="text-[11px] font-semibold">Estrutura</span>
        </button>

        <button onclick="openScreen('flat')" class="bg-[#e6f4f8] hover:bg-cyan-100 text-[#002b49] p-2.5 rounded-2xl flex flex-col items-center justify-center transition shadow-sm border border-cyan-100/50">
          <i class="fa-solid fa-bed text-lg text-[#0088cc] mb-1"></i>
          <span class="text-[11px] font-semibold">O Flat <span data-flat-apto>15B</span></span>
        </button>

        <button onclick="openScreen('onze')" class="bg-[#e6f4f8] hover:bg-cyan-100 text-[#002b49] p-2.5 rounded-2xl flex flex-col items-center justify-center transition shadow-sm border border-cyan-100/50">
          <i class="fa-solid fa-utensils text-lg text-[#0088cc] mb-1"></i>
          <span class="text-[11px] font-semibold">Restaurante</span>
        </button>

        <button onclick="openScreen('compras')" class="bg-[#e6f4f8] hover:bg-cyan-100 text-[#002b49] p-2.5 rounded-2xl flex flex-col items-center justify-center transition shadow-sm border border-cyan-100/50">
          <i class="fa-solid fa-bag-shopping text-lg text-[#0088cc] mb-1"></i>
          <span class="text-[11px] font-semibold">Compras</span>
        </button>

        <button onclick="openScreen('passeios')" class="bg-[#e6f4f8] hover:bg-cyan-100 text-[#002b49] p-2.5 rounded-2xl flex flex-col items-center justify-center transition shadow-sm border border-cyan-100/50">
          <i class="fa-solid fa-umbrella-beach text-lg text-[#0088cc] mb-1"></i>
          <span class="text-[11px] font-semibold">Passeios</span>
        </button>

        <button onclick="openScreen('transporte')" class="bg-[#e6f4f8] hover:bg-cyan-100 text-[#002b49] p-2.5 rounded-2xl flex flex-col items-center justify-center transition shadow-sm border border-cyan-100/50">
          <i class="fa-solid fa-car text-lg text-[#0088cc] mb-1"></i>
          <span class="text-[11px] font-semibold">Transporte</span>
        </button>

        <button onclick="openScreen('info')" class="bg-[#e6f4f8] hover:bg-cyan-100 text-[#002b49] p-2.5 rounded-2xl flex flex-col items-center justify-center transition shadow-sm border border-cyan-100/50">
          <i class="fa-solid fa-user text-lg text-[#0088cc] mb-1"></i>
          <span class="text-[11px] font-semibold">Perfil</span>
        </button>

      </div>

      <!-- Banner Fale com o Anfitrião -->
      <div onclick="openScreen('anfitriao')" class="mt-3 bg-[#e6f4f8] border border-cyan-200 p-3 rounded-2xl flex items-center justify-between cursor-pointer hover:bg-cyan-100 transition shadow-sm">
        <div class="flex items-center gap-3">
          <div class="bg-[#002b49] text-white p-2 rounded-xl">
            <i class="fa-solid fa-comments text-base"></i>
          </div>
          <div>
            <h4 class="text-xs font-bold text-[#002b49]">Fale com o anfitrião</h4>
            <p class="text-[10px] text-gray-500">Estamos prontos para te ajudar!</p>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-gray-400 text-xs"></i>
      </div>
    </main>

    <!-- CONTAINER DE VISUALIZAÇÃO DE TELAS INTERNAS -->
    <div id="detail-screen" class="hidden absolute inset-0 bg-white z-20 flex flex-col">
      <!-- Cabeçalho Interno -->
      <div class="bg-[#002b49] text-white p-4 flex items-center justify-between shrink-0 shadow-md">
        <button onclick="closeScreen()" class="text-white flex items-center gap-2 font-medium text-xs">
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </button>
        <h3 id="detail-title" class="text-sm font-bold tracking-wide text-center flex-1">Título</h3>
        <div class="w-4"></div>
      </div>

      <!-- Área de Conteúdo Dinâmico -->
      <div id="detail-content" class="p-4 flex-1 min-h-0 overflow-y-auto hide-scrollbar bg-gray-50">
      </div>
    </div>

    <!-- RODAPÉ DE NAVEGAÇÃO -->
    <footer class="bg-[#002b49] text-white py-2 px-6 flex justify-between items-center text-[10px] shrink-0">
      <button onclick="closeScreen()" class="flex flex-col items-center gap-0.5 text-cyan-300">
        <i class="fa-solid fa-house text-sm"></i>
        <span>Início</span>
      </button>
      <button class="flex flex-col items-center gap-0.5 text-gray-400 hover:text-white">
        <i class="fa-solid fa-heart text-sm"></i>
        <span>Favoritos</span>
      </button>
      <button onclick="openScreen('localizacao')" class="flex flex-col items-center gap-0.5 text-gray-400 hover:text-white">
        <i class="fa-solid fa-map-location-dot text-sm"></i>
        <span>Mapa</span>
      </button>
      <button onclick="openScreen('mais')" class="flex flex-col items-center gap-0.5 text-gray-400 hover:text-white">
        <i class="fa-solid fa-bars text-sm"></i>
        <span>Mais</span>
      </button>
    </footer>

  </div>

  <!-- SCRIPT COM TODO O CONTEÚDO DAS TELAS -->
  <script>
    const appConfig = { APTO: '15B', CONDOMINIO: '' };

    function getApto() {
      return appConfig.APTO || '15B';
    }

    function getCondominio() {
      return appConfig.CONDOMINIO || '';
    }

    function applyAptoToUI() {
      const apto = getApto();
      const condominio = getCondominio();
      document.title = `Flat ${apto}${condominio ? ` - ${condominio}` : ''}`;

      const condominioName = document.getElementById('condominio-name');
      if (condominioName) condominioName.textContent = condominio;

      document.querySelectorAll('[data-config]').forEach((element) => {
        const key = element.dataset.config;
        element.textContent = appConfig[key] || '';
      });

      const aptoCode = document.getElementById('apto-code');
      if (aptoCode) aptoCode.textContent = apto;

      document.querySelectorAll('[data-flat-apto]').forEach((el) => {
        el.textContent = apto;
      });

      if (screensData) {
        screensData['bem-vindo'].content = screensData['bem-vindo'].content.replace(/15B/g, apto);
        screensData['localizacao'].content = screensData['localizacao'].content.replace(/15B/g, apto);
        screensData['flat'].title = `O Flat ${apto}`;
        screensData['flat'].content = screensData['flat'].content.replace(/15B/g, apto);

        for (const [key, value] of Object.entries(appConfig)) {
          const placeholder = `{{${key}}}`;
          for (const screen of Object.values(screensData)) {
            screen.title = screen.title.split(placeholder).join(value);
            screen.content = screen.content.split(placeholder).join(value);
          }
        }
      }
    }

    async function loadConfig() {
      try {
        let response = await fetch(apiUrl(`config/${encodeURIComponent(getHtmlFileName())}`), { cache: 'no-store' });
        if (!response.ok) {
          const configUrl = new URL(window.location.href);
          configUrl.pathname = configUrl.pathname.endsWith('/')
            ? `${configUrl.pathname}index.sys`
            : configUrl.pathname.replace(/\.html?$/i, '.sys');
          configUrl.search = '';
          configUrl.hash = '';
          response = await fetch(configUrl, { cache: 'no-store' });
        }
        if (!response.ok) throw new Error('Arquivo .sys correspondente não encontrado');

        const text = await response.text();
        const lines = text.split(/\r?\n/);

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || trimmed.startsWith('#') || trimmed.startsWith('//')) continue;

          const index = trimmed.indexOf('=');
          if (index === -1) continue;

          const key = trimmed.slice(0, index).trim().toUpperCase();
          const value = trimmed.slice(index + 1).trim();

          if (key && value) {
            appConfig[key] = value;
          }
        }
      } catch (error) {
        console.warn('Não foi possível carregar config.sys. Usando o valor padrão.', error);
      }

      applyAptoToUI();
    }

    function getHtmlFileName() {
      const pathname = new URL(window.location.href).pathname;
      const fileName = pathname.endsWith('/') ? 'index.html' : pathname.split('/').pop();
      return decodeURIComponent(fileName);
    }

    function apiUrl(endpoint) {
      const pathname = new URL(window.location.href).pathname;
      const basePath = pathname.endsWith('/') ? pathname : pathname.slice(0, pathname.lastIndexOf('/') + 1);
      return `${basePath}api/${endpoint}`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);
    }

    function showParameterScreen(title, content) {
      document.getElementById('detail-title').textContent = title;
      document.getElementById('detail-content').innerHTML = content;
      document.getElementById('detail-screen').classList.remove('hidden');
    }

    function showParameterLogin(errorMessage = '') {
      showParameterScreen('Editar Parâmetros', `
        <form onsubmit="submitParameterLogin(event)" class="mx-auto max-w-sm space-y-4">
          <label for="parameter-password" class="block text-sm font-semibold text-gray-700">Senha</label>
          <input id="parameter-password" type="password" autocomplete="current-password" required class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 focus:border-cyan-600 focus:outline-none focus:ring-2 focus:ring-cyan-100">
          <p id="parameter-login-error" role="alert" class="text-sm text-red-600">${escapeHtml(errorMessage)}</p>
          <div class="grid grid-cols-2 gap-2">
            <button type="submit" class="rounded-lg bg-[#002b49] px-4 py-2.5 text-sm font-semibold text-white hover:bg-[#03446b]">Entrar</button>
            <button type="button" onclick="showPasswordChange(false)" class="rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm font-semibold text-[#002b49] hover:bg-gray-50">Alterar Senha</button>
          </div>
        </form>
      `);
      document.getElementById('parameter-password').focus();
    }

    function showPasswordChange(firstSetup, errorMessage = '') {
      showParameterScreen('Alterar Senha', `
        <form onsubmit="submitPasswordChange(event)" class="mx-auto max-w-sm space-y-4">
          ${firstSetup ? '<p class="rounded-lg border border-cyan-200 bg-cyan-50 p-3 text-sm text-cyan-900">No primeiro acesso, use 123456.</p>' : ''}
          <label for="old-password" class="block text-sm font-semibold text-gray-700">Senha anterior</label>
          <input id="old-password" type="password" autocomplete="current-password" required class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 focus:border-cyan-600 focus:outline-none focus:ring-2 focus:ring-cyan-100">
          <label for="new-password" class="block text-sm font-semibold text-gray-700">Nova senha</label>
          <input id="new-password" type="password" autocomplete="new-password" required class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 focus:border-cyan-600 focus:outline-none focus:ring-2 focus:ring-cyan-100">
          <label for="confirm-password" class="block text-sm font-semibold text-gray-700">Confirme a nova senha</label>
          <input id="confirm-password" type="password" autocomplete="new-password" required class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 focus:border-cyan-600 focus:outline-none focus:ring-2 focus:ring-cyan-100">
          <p id="password-change-error" role="alert" class="text-sm text-red-600">${escapeHtml(errorMessage)}</p>
          <button type="submit" class="w-full rounded-lg bg-[#002b49] px-4 py-2.5 text-sm font-semibold text-white hover:bg-[#03446b]">Salvar Nova Senha</button>
        </form>
      `);
      document.getElementById('old-password').focus();
    }

    async function openParameterEditor() {
      const pageName = getHtmlFileName();
      try {
        const response = await fetch(apiUrl(`session/${encodeURIComponent(pageName)}`), { cache: 'no-store' });
        if (!response.ok) throw new Error('Não foi possível verificar o login.');
        const session = await response.json();
        if (!session.hasPassword) {
          showPasswordChange(true);
          return;
        }
        showParameterLogin();
      } catch (error) {
        showParameterLogin(error.message);
      }
    }

    async function submitParameterLogin(event) {
      event.preventDefault();
      const password = document.getElementById('parameter-password').value;
      try {
        const response = await fetch(apiUrl('login'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ htmlName: getHtmlFileName(), password })
        });
        const result = await response.json();
        if (!response.ok) {
          showParameterLogin(result.error || 'Senha incorreta.');
          return;
        }
        await showParameterEditor();
      } catch (error) {
        showParameterLogin('Não foi possível conectar ao servidor local.');
      }
    }

    async function submitPasswordChange(event) {
      event.preventDefault();
      const oldPassword = document.getElementById('old-password').value;
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const status = document.getElementById('password-change-error');

      if (newPassword !== confirmPassword) {
        status.textContent = 'As novas senhas não são iguais.';
        return;
      }

      try {
        const response = await fetch(apiUrl('password/change'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ htmlName: getHtmlFileName(), oldPassword, newPassword, confirmPassword })
        });
        const result = await response.json();
        if (!response.ok) {
          status.textContent = result.error || 'Não foi possível alterar a senha.';
          return;
        }
        showParameterScreen('Alterar Senha', '<p class="rounded-lg border border-green-200 bg-green-50 p-4 text-center text-sm font-semibold text-green-800">Senha alterada com sucesso.</p>');
        window.setTimeout(() => showParameterEditor(), 1000);
      } catch (error) {
        status.textContent = 'Não foi possível conectar ao servidor local.';
      }
    }

    async function showParameterEditor() {
      const response = await fetch(apiUrl(`config/${encodeURIComponent(getHtmlFileName())}`), { cache: 'no-store' });
      if (!response.ok) {
        showParameterLogin('Não foi possível ler os parâmetros do arquivo .sys.');
        return;
      }

      const lines = (await response.text()).split(/\r?\n/);
      const fields = lines.flatMap((line) => {
        const separator = line.indexOf('=');
        if (separator < 1) return [];
        const key = line.slice(0, separator).trim();
        const value = line.slice(separator + 1).trim();
        return [[key, value]];
      });
      const rows = fields.map(([key, value]) => `
        <label class="grid grid-cols-[minmax(7rem,0.35fr)_minmax(0,1fr)] items-center gap-3 border-b border-gray-100 py-2.5">
          <span class="break-all text-xs font-semibold text-gray-600">${escapeHtml(key)}</span>
          <input data-parameter="${escapeHtml(key)}" type="text" value="${escapeHtml(value)}" class="min-w-0 rounded-md border border-gray-300 bg-white px-2.5 py-2 text-sm text-gray-900 focus:border-cyan-600 focus:outline-none focus:ring-2 focus:ring-cyan-100">
        </label>
      `).join('');

      showParameterScreen('Editar Parâmetros', `
        <form onsubmit="saveParameterConfig(event)" class="space-y-4">
          <div class="divide-y divide-gray-100">${rows}</div>
          <p id="parameter-save-status" role="status" class="text-sm text-red-600"></p>
          <button type="submit" class="w-full rounded-lg bg-[#002b49] px-4 py-2.5 text-sm font-semibold text-white hover:bg-[#03446b]">Salvar</button>
        </form>
      `);
    }

    async function saveParameterConfig(event) {
      event.preventDefault();
      const values = {};
      document.querySelectorAll('[data-parameter]').forEach((input) => {
        values[input.dataset.parameter] = input.value;
      });

      const status = document.getElementById('parameter-save-status');
      try {
        const response = await fetch(apiUrl('config/save'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ htmlName: getHtmlFileName(), values })
        });
        const result = await response.json();
        if (!response.ok) {
          status.textContent = result.error || 'Não foi possível salvar os parâmetros.';
          return;
        }
        showParameterScreen('Editar Parâmetros', '<p class="rounded-lg border border-green-200 bg-green-50 p-4 text-center text-sm font-semibold text-green-800">Alterações salvas com sucesso.</p>');
        window.setTimeout(() => window.location.reload(), 1300);
      } catch (error) {
        status.textContent = 'Não foi possível conectar ao servidor local.';
      }
    }

    const screensData = {
      // TELA 2: BEM-VINDOS
      'bem-vindo': {
        title: 'Bem-vindos',
        content: `
          <div class="space-y-4 text-center">
            <div class="bg-blue-100 h-40 rounded-2xl flex items-center justify-center text-[#002b49] overflow-hidden relative">
              <span class="font-serif italic text-2xl z-10 font-bold">Sejam muito bem-vindos!</span>
              <div class="absolute inset-0 bg-blue-900/10"></div>
            </div>
            <p class="text-xs text-gray-600 leading-relaxed px-2">
              É um prazer receber vocês no nosso flat! Estamos felizes em fazer parte da sua experiência em {{LUGAR1}} / {{LUGAR2}}.
            </p>
            <div class="bg-cyan-50 p-4 rounded-2xl border border-cyan-100 flex items-center gap-3 text-left">
              <i class="fa-solid fa-sun text-amber-500 text-2xl"></i>
              <p class="text-xs text-gray-700">O Flat <span data-flat-apto>15B</span> é o seu refúgio no paraíso, com todo o conforto e praticidade que você merece.</p>
            </div>
            <p class="font-serif italic text-lg text-[#002b49] font-bold mt-4">Aproveite! 🌴</p>
          </div>
        `
      },

      // TELA 3: CHECK-IN
      'checkin': {
        title: 'Check-in',
        content: `
          <div class="space-y-4">
            <!-- HEADER DA PÁGINA CHECK-IN -->
            <div class="bg-[#002b49] text-white p-4 rounded-2xl flex items-center gap-3 shadow-sm">
              <i class="fa-solid fa-key text-2xl text-cyan-300"></i>
              <div>
                <h4 class="font-bold text-sm">Check-in</h4>
                <p class="text-[10px] text-gray-300">O check-in será realizado na recepção do {{CONDOMINIO}}.</p>
              </div>
            </div>

            <!-- SEÇÃO "ANTES DE CHEGAR" DA IMAGEM ENVIADA -->
            <div class="bg-white p-4 rounded-2xl border border-gray-100 space-y-4 shadow-sm">
              <div>
                <h3 class="text-sm font-bold text-[#002b49] mb-1">Antes de chegar</h3>
                <p class="text-xs text-gray-600 leading-relaxed">
                  Para agilizar seu acesso ao condomínio, faça o pré-check-in com os dados dos hóspedes.
                </p>
